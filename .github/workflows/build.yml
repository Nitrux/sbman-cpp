name: SBMan Debian Package

on:
  workflow_dispatch:
    inputs:
      packageCloudRepo:
        description: 'Package Cloud Repo'
        required: true
        default: 'testing'
        type: choice
        options:
        - testing
      packageVersion:
        description: 'Package Version'
        required: true
        type: string

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    container:
      image: debian:testing-20260713-slim
      env:
        DEBIAN_FRONTEND: noninteractive
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install --no-install-recommends -y ca-certificates
      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Check-Date "false";' >> /etc/apt/apt.conf.d/10-no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: amd64
          EOF
          apt update && apt full-upgrade -y

      - name: Setup amd64 environment
        run: apt install --no-install-recommends -y devscripts equivs git gnupg lintian ruby-full sudo

      - name: Install PackageCloud client
        run: gem install package_cloud

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh
        env:
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
          TARGET_ARCH: amd64

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package-amd64
          path: ./build/*.deb

      - name: Publish Debian package
        run: package_cloud push nitrux/${{ inputs.packageCloudRepo }}/debian/duke ./build/*.deb

  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/debian:testing-20260713-slim
      env:
        DEBIAN_FRONTEND: noninteractive
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - name: Install CA certificates
        run: apt update && apt install --no-install-recommends -y ca-certificates
      - name: Update APT sources and upgrade
        run: |
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/10-no-check-valid-until
          echo 'Acquire::Check-Date "false";' >> /etc/apt/apt.conf.d/10-no-check-valid-until
          cat <<EOF > /etc/apt/sources.list.d/debian.sources
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261105T143010Z
          Suites: testing
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Architectures: arm64
          EOF
          apt update && apt full-upgrade -y

      - name: Setup arm64 environment
        run: apt install --no-install-recommends -y devscripts equivs git gnupg lintian ruby-full sudo

      - name: Install PackageCloud client
        run: gem install package_cloud

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh
        env:
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
          TARGET_ARCH: arm64

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package-arm64
          path: ./build/*.deb

      - name: Publish Debian package
        run: package_cloud push nitrux/${{ inputs.packageCloudRepo }}/debian/duke ./build/*.deb
